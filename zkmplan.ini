# Configuration of zkmplan.py (timetable corrections for ZKM Iława).
# Lines that start with # are comments. Change a value, then run the tool again.

[general]
# Name of the bus stop at the railway station (all stops with this name count).
station_stop_name = Dworcowa
# Name of the railway station in the PKP PLK data.
rail_station = Iława Główna
# Number of days, from the first planning date, used to test each proposal.
horizon_days = 28
# Number of dates of each day type that the optimiser uses together.
dates_per_day_type = 5

[transfers]
# Walk time from the platform to the bus stop and from the bus stop to the platform (min).
walk_train_to_bus = 4
walk_bus_to_train = 5
# A transfer is good when the wait after the walk is not longer than this (min).
good_window = 10
# Cover the usual delay of each train category: observed = median delay at the
# station from the collected data (at most delay_buffer_cap min); none = no buffer.
delay_buffer = observed
delay_buffer_cap = 3

[shifts]
# Largest change of a trip at stops other than the station (min).
max_shift = 5
# Largest change of trips that run only on school days (min).
school_max_shift = 2
# Largest extra wait of a bus at the station within one trip (min).
max_extra_dwell = 10
# Penalties in "good transfers per day": a trip moves only when it adds more than
# the penalty. Larger values give fewer changes.
# - for each changed trip:
trip_change_penalty = 0.25
# - for each minute of change at other stops:
habit_penalty = 0.02
# - for each minute of extra dwell at the station:
dwell_penalty = 0.005
# Stages of the proposal: the largest number of changed trips in each stage,
# comma separated. Each stage keeps the changes of the stage before it. The last
# stage has no limit. Empty = one stage.
stages = 20, 40
# Seconds that the solver may use for each day type and block variant.
time_limit = 120

[blocks]
# Shortest layover between two trips of one bus (min).
min_layover = 2
# Stops with the same name closer than this are one terminal (m).
terminal_radius_m = 400
# Block variants to calculate: single (one line per bus), interlined (a bus may
# change line at the station), or both.
variants = both
# Depot of ZKM Iława (ul. Wojska Polskiego 29). Used for trips to and from the depot.
# Empty = the position of the first bus stop whose name contains depot_stop_name.
depot_lat =
depot_lon =
depot_stop_name = Wojska Polskiego
# Longest empty run between two terminals inside a block (km).
max_deadhead_km = 3
# Road distance = straight-line distance x road_factor.
road_factor = 1.3
deadhead_kmh = 25

[duties]
# Stops where drivers can change (relief points), comma separated.
relief_points = Dworcowa
# Longest duty including preparation time (min).
max_duty = 510
prep_minutes = 15
# Break rules for regular lines up to 50 km (ustawa o czasie pracy kierowców).
break_part = 15
break_after_6h = 30
break_after_8h = 45
max_driving = 600

[costs]
# Unit costs. Defaults are estimates for a small Polish city in 2026, not ZKM data.
# Replace them with the operator's figures when they are available.
# Share of kilometres run by electric buses (ZKM fleet: 6 of 19 buses electric).
electric_share = 0.30
diesel_l_per_100km = 36
diesel_pln_per_l = 5.90
electric_kwh_per_km = 1.10
electricity_pln_per_kwh = 0.95
maintenance_pln_per_km = 0.90
# Employer cost of one driver hour (gross wage plus social security).
driver_pln_per_hour = 55
# Depreciation, insurance and fixed costs of one bus per day.
vehicle_fixed_pln_per_day = 160
# Share of reserve buses on top of the peak number.
reserve_share = 0.15
# Overhead (management, depot, dispatch) as a share of direct cost.
overhead_share = 0.15
# Show values in PLN (costs and revenue) in the report: yes or no. Set yes only
# after you replace the unit costs and the ticket data with the operator's values.
show_money = no

[demand]
# Average daily passenger exchange at the railway station (boardings plus
# alightings), Urząd Transportu Kolejowego, year 2025.
station_daily_exchange = 4700
# Share of station passengers who use the city bus (low / mid / high variant).
bus_share_low = 0.05
bus_share_mid = 0.10
bus_share_high = 0.15
# Change of bus use for a 1 % change of the waiting time at the transfer.
wait_elasticity_low = -0.2
wait_elasticity_mid = -0.4
wait_elasticity_high = -0.7
# Ticket prices of ZKM Iława (PLN): single ticket, full fare and reduced fare.
fare_normal = 4.00
fare_reduced = 2.00
# Share of trips on reduced tickets, and share of trips without a ticket sale
# (free travel). Estimates: replace them with the operator's data.
share_reduced = 0.50
share_free = 0.20
# Average revenue per bus trip (PLN), period tickets included. Empty = calculated
# from the prices and shares above. Enter the operator's value when it is known.
revenue_per_trip =
# Waits above this count as this value: the passenger chooses another way (min).
wait_cap = 60
